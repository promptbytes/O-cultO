# One-click hosting on Render (https://render.com): New > Blueprint > pick
# this repo and the `main` branch. Render gives the app an https address
# and redeploys it whenever `main` changes. The service follows the branch
# the Blueprint is set to, so no branch is named here.
services:
  - type: web
    name: o-culto
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node server/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
